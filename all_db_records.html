514, "uncaught": 0.013513513513513514, "exception": 0.013513513513513514, "from": 0.013513513513513514, "downstream": 0.02702702702702703, "services": 0.013513513513513514, "e.g": 0.013513513513513514, "auth-service": 0.013513513513513514, "payment-gateway": 0.013513513513513514, "2": 0.013513513513513514, "connection": 0.013513513513513514, "timeout": 0.02702702702702703, "proxy": 0.013513513513513514, "triggered": 0.013513513513513514, "because": 0.013513513513513514, "query": 0.013513513513513514, "latency": 0.013513513513513514, "5000ms": 0.013513513513513514, "3": 0.013513513513513514, "out": 0.02702702702702703, "of": 0.013513513513513514, "memory": 0.013513513513513514, "oom": 0.013513513513513514, "worker": 0.013513513513513514, "saturation": 0.013513513513513514, "node": 0.013513513513513514, "uvicorn": 0.013513513513513514, "workers": 0.013513513513513514, "maxed": 0.013513513513513514, "due": 0.013513513513513514, "to": 0.013513513513513514, "leaked": 0.013513513513513514, "sockets": 0.013513513513513514, "unhandled": 0.013513513513513514, "promise": 0.013513513513513514, "rejections": 0.013513513513513514}, "created_at": "2026-10-30 11:26:39.719175"}, {"id": 14, "document_id": 3, "doc_title": "Runbook Http 500 Api Gateway", "chunk_index": 2, "content": "or Worker Saturation**: Node/Uvicorn workers maxed out due to leaked sockets or unhandled promise rejections.\n## Diagnostic Procedures\n1. Run `query_application_logs` with filter `level=\"ERROR\"` and `service=\"api-gateway\"`.\n2. Inspect stack traces for `ConnectionRefusedError`, `502 Bad Gateway`, or `PoolTimeout`.\n3. Check `get_service_status` for `api-gateway` and downstream dependencies (`auth-service`, `payment-gateway`).\n4. If logs show `Database connection timeout`, escalate check to `db-diagnostic-tool`.", "vector_type": "Sparse Lexical Vector", "vector_dimensions": 53, "embedding_sample": [["or", 0.05], ["worker", 0.016666666666666666], ["saturation", 0.016666666666666666], ["node", 0.01666 lback_deployment": 0.021739130434782608, "version": 0.021739130434782608, "previous": 0.021739130434782608, "reverts": 0.021739130434782608, "runtime": 0.021739130434782608, "config": 0.021739130434782608}, "created_at": "2026-10-30 11:26:39.719177"}, {"id": 17, "document_id": 3, "doc_title": "Runbook Http 500 Api Gateway", "chunk_index": 5, "content": "Causes 5-10s packet drop). - **Rollback Configuration Deployment**: `rollback_deployment(service=\"api-gateway\", version=\"previous\")` (Risk: High. Reverts runtime config).\n## Verification Step\n1. Execute `probe_service_health(service=\"api-gateway\", endpoint=\"/healthz\")`. Expected HTTP Status: `200 OK`.\n2. Confirm error rate drops below 0.1% within 60 seconds.\n3. If still returning 500, check `auth-service` dependency.", "vector_type": "Sparse Lexical Vector", "vector_dimensions": 47, "embedding_sample": [["causes", 0.02040816326530612], ["5-10s", 0.02040816326530612], ["packet", 0.02040816326530612], ["drop", 0.02040816326530612], ["rollback", 0.02040816326530612], ["configuration", 0.02040816326530612]], "embedding_full": {"causes": 0.02040816326530612, "5-10s": 0.02040816326530612, "packet": 0.02040816326530612, "drop": 0.02040816326530612, "rollback": 0.02040816326530612, "configuration": 0.02040816326530612, "deployment": 0.02040816326530612, "rollback_deployment": 0.02040816326530612, "service": 0.04081632653061224, "api-gateway": 0.04081632653061224, "version": 0.02040816326530612, "previous": 0.02040816326530612, "risk": 0.02040816326530612, "high": 0.02040816326530612, "reverts": 0.02040816326530612, "runtime": 0.02040816326530612, "config": 0.02040816326530612, "verification": 0.02040816326530612, "step": 0.02040816326530612, "1": 0.02040816326530612, "execute": 0.02040816326530612, "probe_service_health": 0.02040816326530612, "endpoint": 0.02040816326530612, "healthz": 0.02040816326530612, "expected": 0.02040816326530612, "http": 0.02040816326530612, "status": 0.02040816326530612, "200": 0.020408 57, "enterprise": 0.02857142857142857, "it": 0.05714285714285714, "inquiry": 0.02857142857142857, "access": 0.02857142857142857, "requests": 0.02857142857142857, "service": 0.02857142857142857, "enterprise-it": 0.02857142857142857, "category": 0.02857142857142857, "general_it": 0.02857142857142857, "default": 0.02857142857142857, "severity": 0.02857142857142857, "p4_low": 0.02857142857142857, "1": 0.02857142857142857, "overview": 0.02857142857142857, "standard": 0.02857142857142857, "operating": 0.02857142857142857, "procedures": 0.02857142857142857, "for": 0.02857142857142857, "non-incident": 0.02857142857142857, "inquiries": 0.02857142857142857, "including": 0.02857142857142857, "vpn": 0.02857142857142857, "setup": 0.02857142857142857, "mfa": 0.02857142857142857, "resets": 0.02857142857142857, "corporate": 0.02857142857142857, "wi-fi": 0.02857142857142857, "credentials": 0.02857142857142857, "and": 0.02857142857142857, "developer": 0.02857142857142857, "workstation": 0.02857142857142857, "onboarding": 0.02857142857142857}, "created_at": "2026-10-31 07:23:12.771327"}, {"id": 32, "document_id": 7, "doc_title": "Runbook General It Inquiry", "chunk_index": 1, "content": "non-incident IT inquiries, including VPN setup, MFA resets, corporate Wi-Fi credentials, and developer workstation onboarding.\n## 2. Common Topics & Resolutions\n- **GlobalProtect VPN Setup**: Download the enterprise client from `https://vpn.enterprise.io`. Connect using your Okta SSO identity and hardware MFA key.\n- **MFA Token Desync**: Navigate to `https://id.enterprise.io/self-service/mfa` to re-enroll your authenticator app.\n- **SSH Key Onboarding**: Submit public ed25519 keys via the internal developer portal at `https://dev.enterprise.io/keys`.\n- **Corporate Web Filtering & Blocked Websites (e.g. YouTube, Streaming Media)**:\n  - Video streaming platforms (including `youtube.com`) and social media are restricted by default on corporate networks and VPN under the Enterprise Acceptable Use & Content Filtering Policy (enforced by Zscaler / Corporate Firewall).\n  - This is an intentional security and bandwidth management policy, NOT an IT infrastructure failure.\n  - **Business Exception Procedure**: If YouTube access is required for legitimate job functions (e.g., watching developer tech talks, official product tutorials, or marketing):\n    1. Navigate to the IT Self-Service Portal at `https://it.enterprise.io/requests/url-exception`.\n    2. Fill out the \"Web Category Exception\" form and provide business justification.\n    3. Include your direct manager's email for automated approval.\n    4. IT Network Security will provision the policy exception within 24 hours of approval.", "vector_type": "Sparse Lexical Vector", "vector_dimensions": 134, "embedding_sample": [["non-incident", 0.005208333333333333], ["it", 0.020833333333333332], ["inquiries", 0.005208333333333333], ["including", 0.010416666666666666], ["vpn", 0.015625], ["setup", 0.010416666666666666]], "embedding_full": {"non-incident": 0.005208333333333333, "it": 0.020833333333333332, "inquiries": 0.005208333333333333, "including": 0.010416666666666666, "vpn": 0.015625, "setup": 0.010416666666666666, "mfa": 0.020833333333333332, "resets": 0.005208333333333333, "corporate": 0.020833333333333332, "wi-fi": 0.005208333333333333, "credentials": 0.005208333333333333, "and": 0.03125, "developer": 0.015625, "workstation": 0.005208333333333333, "onboarding": 0.010416666666666666, "2": 0.010416666666666666, "common": 0.005208333333333333, "topics": 0.005208333333333333, "resolutions": 0.005208333333333333, "globalprotect": 0.005208333333333333, "download": 0.005208333333333333, "the": 0.03125, "enterprise": 0.010416666666666666, "client": 0.005208333333333333, "from": 0.005208333333333333, "https": 0.020833333333333332, "vpn.enterprise.io": 0.005208333333333333, "connect": 0.005208333333333333, "using": 0.005208333333333333, "your": 0.015625, "okta": 0.005208333333333333, "sso": 0.005208333333333333, "i t": "2026-11-05 10:20:56.592273", "resolved_at": "2026-11-05 10:20:59.017466"}, {"id": 196, "ticket_number": "28009", "title": "GlobalProtect VPN connection failed on Mac", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "SOLANKIBHARGAV45@GMAIL.COM", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The GlobalProtect VPN connection failed on Mac due to a clock skew or expired signing key, which caused the SSO identity provider handshake to timeout. This is a common issue that can occur when secret key rotation occurs without a rolling grace period.\nResolution: To resolve this issue, please follow these steps:\n1. Check the GlobalProtect VPN client logs for any error messages related to the SSO identity provider handshake.\n2. If you are using a hardware MFA key, try resetting it and then reconnecting to the VPN.\n3. If you are using a software MFA token, try resetting it and then reconnecting to the VPN.\n4. If none of the above steps resolve the issue, please submit a URL Category Exception ticket with your manager's sign-off to request access to internal network resources.", "created_at": "2026-11-03 18:12:21.907755", "resolved_at": "2026-11-03 18:13:31.582008"}, {"id": 195, "ticket_number": "INC-2026-512", "title": "GlobalProtect VPN connection failed on Mac", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "SOLANKIBHARGAV45@GMAIL.COM", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The GlobalProtect VPN connection failed on Mac due to a clock skew or expired signing key. This is a common issue that can occur when secret key rotation occurs without rolling a grace period.\nResolution: To resolve this issue, please follow these steps:\n1. Check the GlobalProtect VPN client logs for any error messages.\n2. Verify that the signing key has not expired and is up-to-date.\n3. If the signing key is expired, contact the IT department to request a new key and follow the secret key rotation procedure.\n4. Once the new key is in place, restart the GlobalProtect VPN client and attempt to reconnect to the internal network resources.", "created_at": "2026-11-03 18:02:29.652488", "resolved_at": "2026-11-03 18:03:27.191062"}, {"id": 194, "ticket_number": "28008", "title": "my name is bjatah", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "mcaddit28@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The employee's request to share their name is not a technical issue, but rather a personal preference. However, this information is not typically stored in the HR system or used for authentication purposes. The employee's name is not a critical system configuration, and no action is required to resolve this.\nResolution: This is an informational request, not a technical issue. The employee can provide their name through the HR system or other relevant channels. No self-service instructions are required for this inquiry.", "created_at": "2026-11-01 14:38:26.702432", "resolved_at": "2026-11-01 14:39:08.382126"}, {"id": 193, "ticket_number": "28007", "title": "VPN not working", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "solankibhargav45@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The issue is likely due to a connection timeout triggered by the gateway proxy. To resolve, try restarting the gateway proxy or checking the connection settings. If the issue persists, contact the IT support team for further assistance.\nResolution: To troubleshoot, navigate to the Okta Self-Service portal and check the VPN connection settings. Ensure that the hardware MFA key is correctly paired with the Okta SSO identity. If issues persist, restart the gateway proxy and try connecting again. If the issue remains, submit a URL Category Exception ticket with your manager's sign-off to request access to the VPN.", "created_at": "2026-11-01 14:30:45.731875", "resolved_at": "2026-11-01 14:31:18.709729"}, {"id": 192, "ticket_number": "28006", "title": "youtube is not woorking", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "mcaddit28@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "Access to YouTube is restricted under the corporate Web Filtering & Acceptable Use Policy.\nResolution: This is an intentional security policy, not a technical outage. To request access for work purposes, submit a URL Category Exception ticket with your manager's sign-off.", "created_at": "2026-11-01 14:27:30.606633", "resolved_at": "2026-11-01 14:28:07.643152"}, {"id": 191, "ticket_number": "28005", "title": "VPN not connecting", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "solankibhargav45@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The GlobalProtect VPN is not connecting due to a potential issue with the Okta SSO identity or hardware MFA key. Please ensure that your identity and MFA key are correctly configured and up-to-date.\nResolution: To resolve this issue, please follow these steps:\n1. Download and install the latest version of the GlobalProtect VPN client from https://vpn.enterprise.io.\n2. Connect to the VPN using your Okta SSO identity and hardware MFA key.\nIf you continue to experience issues, please contact the Enterprise IT Support team for further assistance.", "created_at": "2026-11-01 14:23:51.797407", "resolved_at": "2026-11-01 14:24:23.582602"}, {"id": 190, "ticket_number": "INC-2026-832", "title": "VPN test", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "solankibhargav45@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The VPN is not connecting due to an incorrect VPN configuration or missing VPN client software. Please ensure that the VPN client software is installed and configured correctly, and that the VPN connection settings are accurate.\nResolution: To resolve this issue, please follow these steps:\n1. Ensure that the VPN client software is installed and up-to-date.\n2. Verify that the VPN connection settings are correct and match the company's VPN configuration.\n3. If you are using a mobile device, ensure that the VPN app is installed and configured correctly.\n4. If you are still experiencing issues, contact the Enterprise IT Support team for assistance.", "created_at": "2026-11-01 14:21:24.370100", "resolved_at": "2026-11-01 14:21:59.275101"}, {"id": 189, "ticket_number": "INC-2026-549", "title": "VPN not working", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "solankibhargav45@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The root cause of the issue is a connection timeout triggered by the gateway proxy, which is likely due to a misconfigured or expired MFA token. This is a common issue that can be resolved by navigating to https://id.enterprise.io/self-service/mfa to reset the MFA token.\nResolution: To resolve this issue, please follow these steps:\n1. Navigate to https://id.enterprise.io/self-service/mfa to reset the MFA token.\n2. Once the token is reset, try connecting to the VPN again using your Okta SSO identity and hardware MFA key.", "created_at": "2026-11-01 14:04:29.249278", "resolved_at": "2026-11-01 14:04:54.392430"}, {"id": 188, "ticket_number": "INC-2026-722", "title": "youtube is blocked", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "mcaddit28@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "Access to YouTube is restricted under the corporate Web Filtering & Acceptable Use Policy.\nResolution: This is an intentional security policy, not a technical outage. To request access for work purposes, submit a URL Category Exception ticket with your manager's sign-off.", "created_at": "2026-11-01 14:01:52.902733", "resolved_at": "2026-11-01 14:02:13.186382"}, {"id": 187, "ticket_number": "INC-2026-248", "title": "youtube is blocked", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "mcaddit28@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "Access to YouTube is restricted under the corporate Web Filtering & Acceptable Use Policy.\nResolution: This is an intentional security policy, not a technical outage. To request access for work purposes, submit a URL Category Exception ticket with your manager's sign-off.", "created_at": "2026-11-01 13:59:23.179288", "resolved_at": "2026-11-01 13:59:54.934829"}, {"id": 186, "ticket_number": "INC-2026-209", "title": "youtube is not working fine in my laptop", "severity": "P4_LOW", "status": "RESOLVED ff.", "created_at": "2026-11-01 13:28:09.722484", "resolved_at": "2026-11-01 13:29:02.224544"}, {"id": 183, "ticket_number": "INC-2026-945", "title": "GlobalProtect VPN connection failed on Mac Cannot reach internal network resources over corporate VPN.", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "SOLANKIBHARGAV45@GMAIL.COM", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The GlobalProtect VPN connection failed on Mac because the user did not connect using their Okta SSO identity and hardware MFA key, which is required for the enterprise client to function correctly. This is a result of not following the standard operating procedures for GlobalProtect VPN setup.\nResolution: To resolve this issue, please download the enterprise client from https://vpn.enterprise.io and connect using your Okta SSO identity and hardware MFA key. If you are unsure about the setup process, please refer to the GlobalProtect VPN Setup section in the IT Runbook Context.", "created_at": "2026-11-01 13:21:43.837414", "resolved_at": "2026-11-01 13:22:44.684759"}, {"id": 182, "ticket_number": "INC-2026-982", "title": "GlobalProtect VPN connection failed on Mac Cannot reach internal network resources over corporate VPN.", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "SOLANKIBHARGAV45@GMAIL.COM", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The GlobalProtect VPN connection failed on Mac because the user did not connect using their Okta SSO identity and hardware MFA key, which is required for the enterprise client to function correctly. This is a standard security policy to ensure only authorized users can access internal network resources.\nResolution: To resolve this issue, please download the enterprise client from https://vpn.enterprise.io and connect using your Okta SSO identity and hardware MFA key. If you are unsure about the connection process, refer to the GlobalProtect VPN Setup section in the IT Runbook.", "created_at": "2026-11-01 13:13:12.541908", "resolved_at": "2026-11-01 13:14:02.843353"}, {"id": 181, "ticket_number": "INC-2026-284", "title": "GlobalProtect VPN connection failed on Mac", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "employee@enterprise.io", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The GlobalProtect VPN connection failed on the Mac due to an incorrect configuration or missing hardware MFA key. Ensure that the client is properly installed and connected using the Okta SSO identity and hardware MFA key.\nResolution: To resolve this issue, follow these steps:\n1. Download and install the Enterprise GlobalProtect VPN client from https://vpn.enterprise.io.\n2. Connect to the VPN using your Okta SSO identity and hardware MFA key.\n3. If you are still experiencing issues, navigate to https://id.enterprise.io/self-service/mfa to reset your MFA token.\nThis is an intentional security policy, not a technical outage. To request access for work purposes, submit a URL Category Exception ticket with your manager's sign-off.", "created_at": "2026-11-01 12:46:06.654557", "resolved_at": "2026-11-01 12:46:39.518728"}, {"id": 180, "ticket_number": "INC-2026-903", "title": "VPN connection dropped on Mac", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "solankibhargav45@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "The GlobalProtect VPN connection has dropped due to a connection timeout triggered by the gateway proxy. This is likely caused by an upstream microservice failure or a misconfigured gateway proxy.\nResolution: To resolve this issue, please try the following steps:\n\n1. Restart the GlobalProtect VPN client on your Mac.\n2. Check the gateway proxy configuration and ensure that it is correctly set up.\n3. If the issue persists, submit a URL Category Exception ticket with your manager's sign-off to request access to the internal network.", "created_at": "2026-11-01 12:40:46.791571", "resolved_at": "2026-11-01 12:41:19.921481"}, {"id": 179, "ticket_number": "INC-2026-594", "title": "I got a new phone, how do I reset my MFA authenticator token?", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "employee@enterprise.io", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "To reset your MFA authenticator token, navigate to https://id.enterprise.io/self-service/mfa, select your current token, and click 'Reset Token'. Then, follow the prompts to generate a new token.\nResolution: Please follow these steps to reset your MFA token: 1. Go to https://id.enterprise.io/self-service/mfa, 2. Select your current token, 3. Click 'Reset Token', 4. Follow the prompts to generate a new token. If you need assistance, contact the IT Support team.", "created_at": "2026-10-31 18:15:50.984191", "resolved_at": "2026-10-31 18:16:31.952116"}, {"id": 178, "ticket_number": "TEST-DB-70bf40", "title": "Database connection timeout during checkout surge", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "DATABASE", "affected_service": "order-db", "reporter_email": "devops@enterprise.io", "proposed_action": "execute_service_restart(service_name='order-db')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: Telemetry failure detected: Connection pool initialized: min_size=10, max_size=100. Superuser connection reserved.. Remediation action: execute_service_restart(service_name='order-db'). Post-recovery probe confirmed service 'order-db' healthy at 200 OK.", "created_at": "2026-10-31 18:12:41.383329", "resolved_at": "2026-10-31 18:12:41.494683"}, {"id": 177, "ticket_number": "TEST-INC-0c4efc", "title": "Application returning HTTP 500 errors. Cannot access checkout.", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "APPLICATION", "affected_service": "api-gateway", "reporter_email": "employee@enterprise.io", "proposed_action": "execute_service_restart(service_name='api-gateway')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: Telemetry failure detected: Gateway routing engine initialized. Upstreams: order-db, auth-service, payment-gateway healthy.. Remediation action: execute_service_restart(service_name='api-gateway'). Post-recovery probe confirmed service 'api-gateway' healthy at 200 OK.", "created_at": "2026-10-31 18:12:41.241539", "resolved_at": "2026-10-31 18:12:41.375771"}, {"id": 176, "ticket_number": "TEST-YT-182FA0", "title": "youtube is not working it shows blocked website from the company", "severity": "P4_LOW", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "solankibhargav45@gmail.com", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "Access to YouTube is restricted under the corporate Web Filtering & Acceptable Use Policy.\nResolution: This is an intentional security policy, not a technical outage. To request access for work purposes, submit a URL Category Exception ticket with your manager's sign-off.", "created_at": "2026-10-31 18:11:55.0 eway timing out with HTTP 504 on Stripe webhook", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "APPLICATION", "affected_service": "payment-gateway", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='payment-gateway')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: The root cause of the issue is a combination of upstream payment provider timeout and a socket deadlock in the payment processing worker pool. The payment-gateway microservice is experiencing a high volume of concurrent transactions, leading to CPU saturation and worker thread state issues. The upstream payment provider (Stripe) is timing out after 30 seconds, causing the payment processing worker to deadlock. This is further exacerbated by the backlog of unprocessed webhook events, which is exceeding 500 events.. Remediation action: execute_service_restart(service_name='payment-gateway'). Post-recovery probe confirmed service 'payment-gateway' healthy at 200 OK.", "created_at": "2026-10-31 18:08:00.935286", "resolved_at": "2026-10-31 18:08:45.908945"}, {"id": 171, "ticket_number": "BENCH-UC-04-9667", "title": "Redis cache memory saturation causing high latency and cache misses", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "INFRASTRUCTURE", "affected_service": "redis-cache", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "clear_cache(service_name='redis-cache')", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: Redis memory saturation due to high memory allocation and OOM eviction policy, leading to cache latency spikes and hit ratio drops. The 'maxmemory-policy allkeys-lru' configuration is causing thrashing, resulting in evicted keys surge.. Remediation action: clear_cache(service_name='redis-cache'). Post-recovery probe confirmed service 'redis-cache' healthy at 200 OK.", "created_at": "2026-10-31 18:07:30.177581", "resolved_at": "2026-10-31 18:08:00.930926"}, {"id": 170, "ticket_number": "BENCH-UC-03-F706", "title": "Users being logged out randomly with 401 Unauthorized", "severity": "P2_HIGH", "status": "RESOLVED", "category": "AUTHENTICATION", "affected_service": "auth-service", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='auth-service')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: The JWT Signature Verification Failed error indicates that the key ID 'kid-2024-q3' has expired, causing the identity provider JWKS public key cache to become out of sync. This is further exacerbated by the fact that the JWKS certificate rotation was missing in the local in-memory cache, leading to a cascade of 401 Unauthorized and 403 Forbidden errors.. Remediation action: execute_service_restart(service_name='auth-service'). Post-recovery probe confirmed service 'auth-service' healthy at 200 OK.", "created_at": "2026-10-31 18:06:48.566833", "resolved_at": "2026-10-31 18:07:30.173024"}, {"id": 169, "ticket_number": "BENCH-UC-02-5A41", "title": "Database connection timeout during checkout surge", "severity": "P2_HIGH", "status": "RESOLVED", "category": "DATABASE", "affected_service": "order-db", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_flush_db_pool(database_name='order-db')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: Connection leak due to unclosed session contexts in worker threads, causing 42 connections to be stuck in 'IDLE in transaction' for over 180 seconds. This is exacerbated by heavy report queries blocking table rows with exclusive locks, leading to a QueuePool limit of size 50 being overflowed.. Remediation action: execute_flush_db_pool(database_name='order-db'). Post-recovery probe confirmed service 'order-db' healthy at 200 OK.", "created_at": "2026-10-31 18:06:08.356287", "resolved_at": "2026-10-31 18:06:48.562093"}, {"id": 168, "ticket_number": "BENCH-UC-01-63C2", "title": "Application returning HTTP 500 errors - users unable to access app", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "APPLICATION", "affected_service": "api-gateway", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='api-gateway')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: The root cause of the incident is a worker process deadlock in the API Gateway, triggered by an unhandled promise leak in worker threads. This led to a connection timeout and a subsequent HTTP 500 Internal Server Error. The gateway was unable to establish a handshake or receive an uncaught exception from downstream services, such as auth-service or payment-gateway.. Remediation action: execute_service_restart(service_name='api-gateway'). Post-recovery probe confirmed service 'api-gateway' healthy at 200 OK.", "created_at": "2026-10-31 18:05:24.969602", "resolved_at": "2026-10-31 18:06:08.348090"}, {"id": 167, "ticket_number": "BENCH-UC-06-94BE", "title": "How do I configure GlobalProtect VPN and SSH access keys?", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "provide_knowledge_guidance()", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "Inquiry resolved autonomously. Root cause: Inquiry diagnosis on 'enterprise-it' from runbook context: non-incident IT inquiries, including VPN setup, MFA resets, corporate Wi-Fi credentials, and status": "AUTO_APPROVED", "resolution_notes": "Inquiry resolved autonomously. Root cause: To configure GlobalProtect VPN on your Mac, follow these steps:\n\n1. Download the enterprise client from https://vpn.enterprise.io.\n2. Connect using your Okta SSO identity and hardware MFA key.\n\nFor SSH access key submission for staging cluster, please refer to the following steps:\n\n1. Generate a new SSH key pair using the `ssh-keygen` command.\n2. Copy the public SSH key and submit it to your designated cluster administrator.\n\nIf you encounter any issues or require further assistance, please don't hesitate to reach out to the Enterprise IT team.. Provided enterprise runbook policy guidance and self-service URL unblock request procedure.", "created_at": "2026-10-31 17:47:06.897654", "resolved_at": "2026-10-31 17:47:31.488703"}, {"id": 149, "ticket_number": "BENCH-UC-05-25FF", "title": "Payment gateway timing out with HTTP 504 on Stripe webhook", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "APPLICATION", "affected_service": "payment-gateway", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='payment-gateway')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: The root cause of the issue is a combination of upstream payment provider timeout and a socket deadlock in the payment processing worker pool. The payment-gateway microservice is experiencing a high volume of concurrent transactions, leading to CPU saturation and worker thread state issues. The upstream payment provider (Stripe) is timing out after 30 seconds, causing the payment processing worker to deadlock. This is further exacerbated by the backlog of unprocessed webhook events, which is exceeding 500 events.. Remediation action: execute_service_restart(service_name='payment-gateway'). Post-recovery probe confirmed service 'payment-gateway' healthy at 200 OK.", "created_at": "2026-10-31 17:46:26.327194", "resolved_at": "2026-10-31 17:47:06.893092"}, {"id": 148, "ticket_number": "BENCH-UC-04-0C52", "title": "Redis cache memory saturation causing high latency and cache misses", "severity": "P3_MEDIUM", "status": "RESOLVED", "category": "INFRASTRUCTURE", "affected_service": "redis-cache", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "clear_cache(service_name='redis-cache')", "action_risk_level": "LOW", "human_approval_status": "AUTO_APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: The root cause of the issue is a memory saturation issue in the Redis cache, leading to OOM evictions and thrashing. The maxmemory policy is set to allkeys-lru, which is causing the cache to evict keys in a way that leads to thrashing. This is further exacerbated by the high memory usage, which exceeds the 90% threshold.. Remediation action: clear_cache(service_name='redis-cache'). Post-recovery probe confirmed service 'redis-cache' healthy at 200 OK.", "created_at": "2026-10-31 17:46:00.681529", "resolved_at": "2026-10-31 17:46:26.319900"}, {"id": 147, "ticket_number": "BENCH-UC-03-CB56", "title": "Users being logged out randomly with 401 Unauthorized", "severity": "P2_HIGH", "status": "RESOLVED", "category": "AUTHENTICATION", "affected_service": "auth-service", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='auth-service')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: The root cause of the incident is due to the expired signing key 'kid-2024-q3' in the JWT public key cache, which led to a signature verification failure. This was caused by a lack of rolling grace period during secret key rotation, resulting in a clock skew. The incident was further exacerbated by a Redis token cache down, which prevented session lookup and led to a cascade of 401 Unauthorized errors.. Remediation action: execute_service_restart(service_name='auth-service'). Post-recovery probe confirmed service 'auth-service' healthy at 200 OK.", "created_at": "2026-10-31 17:45:25.071374", "resolved_at": "2026-10-31 17:46:00.676166"}, {"id": 146, "ticket_number": "BENCH-UC-02-94D5", "title": "Database connection timeout during checkout surge", "severity": "P2_HIGH", "status": "RESOLVED", "category": "DATABASE", "affected_service": "order-db", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_flush_db_pool(database_name='order-db')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: A sudden spike in incoming checkout requests exceeded the configured pool max, causing a connection leak due to unclosed session contexts in worker threads holding connections idle in transaction (IDLE in transaction > 120s). This, in turn, led to heavy report query blocking table rows with exclusive locks, resulting in slow / long-running analytical queries and a QueuePool limit of size 20 overflow 10 reached, giving up.. Remediation action: execute_flush_db_pool(database_name='order-db'). Post-recovery probe confirmed service 'order-db' healthy at 200 OK.", "created_at": "2026-10-31 17:44:47.494315", "resolved_at": "2026-10-31 17:45:25.064746"}, {"id": 145, "ticket_number": "BENCH-UC-01-25EA", "title": "Application returning HTTP 500 errors - users unable to access app", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "APPLICATION", "affected_service": "api-gateway", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='api-gateway')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: The root cause of the incident is a worker process deadlock in the API Gateway, triggered by an unhandled promise leak in worker threads. This led to a connection timeout and a worker memory limit exceeded error. The gateway was unable to establish a handshake or receive an uncaught exception from downstream services (e.g. auth-service or payment-gateway).. Remediation action: execute_service_restart(service_name='api-gateway'). Post-recovery probe confirmed service 'api-gateway' healthy at 200 OK.", "created_at": "2026-10-31 17:44:05.798050", "resolved_at": "2026-10-31 17:44:47.488932"}, {"id": 144, "ticket_number": "BENCH-UC-06-68BB", "title": "How do I configure GlobalProtect VPN and SSH access keys?", "severity": "P4_LOW", "status": "AWAITING_APPROVAL", "category": "GENERAL_IT", "affected_service": "enterprise-it", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='enterprise-it')", "action_risk_level": "HIGH", "human_approval_status": "PENDING", "resolution_notes": null, "created_at": "2026-10-31 17:38:52.506752", "resolved_at": null}, {"id": 143, "ticket_number": "BENCH-UC-05-A696", "title": "Payment gateway timing out with HTTP 504 on Stripe webhook", "severity": "P1_CRITICAL", "status": "RESOLVED", "category": "APPLICATION", "affected_service": "payment-gateway", "reporter_email": "benchmark-runner@enterprise.io", "proposed_action": "execute_service_restart(service_name='payment-gateway')", "action_risk_level": "HIGH", "human_approval_status": "APPROVED", "resolution_notes": "Incident autonomously diagnosed and resolved. Root cause: Payment processing worker deadlock caused by upstream banking API webhook acknowledgement timeout after 30000ms, resulting in HTTP 504 Gateway Timeout and client checkout requests failing with payment processing timeout after 30 seconds.. Remediation action: execute_service_restart(service_name='payment-gateway'). Post-recovery probe confirmed service 'payment-gateway' healthy at 200 OK.", "created_at": "2026-10-31 17:38     let currentTab = 'incidents';

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('[id^="tab-"]').forEach(btn => {
        btn.className = "px-4 py-2 rounded-lg text-xs font-semibold transition-all bg-slate-900 text-slate-300 hover:bg-slate-800";
      });
      document.getElementById(`tab-${tab}`).className = "px-4 py-2 rounded-lg text-xs font-semibold transition-all bg-blue-600 text-white shadow-md";
      renderTable();
    }

    function renderTable() {
      const items = dbData[currentTab] || [];
      const query = document.getElementById('global-search').value.toLowerCase().trim();
      const filtered = items.filter(row => {
        if (!query) return true;
        return Object.values(row).some(v => String(v || '').toLowerCase().includes(query));
      });

      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      if (filtered.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td class="p-8 text-center text-slate-500 font-sans">No matching records found</td></tr>`;
        return;
      }

      // Build headers
      const cols = Object.keys(filtered[0]).filter(k => k !== 'embedding_full');
      thead.innerHTML = `<tr>${cols.map(c => `<th class="p-3 text-[11px] whitespace-nowrap uppercase">${c}</th>`).join('')}<th class="p-3"></th></tr>`;

      // Build rows
      tbody.innerHTML = filtered.map((row, idx) => {
        return `
          <tr class="hover:bg-slate-800/40 transition-colors">
            ${cols.map(c => {
              let val = row[c];
              if (typeof val === 'object' && val !== null) val = JSON.stringify(val);
              let str = String(val || '');
              if (str.length > 50) str = str.slice(0, 50) + '...';
              return `<td class="p-3 whitespace-nowrap overflow-hidden text-ellipsis max-w-xs text-slate-300">${str.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</td>`;
            }).join('')}
            <td class="p-3 whitespace-nowrap text-right">
              <button onclick="viewRecord('${currentTab}', ${idx})" class="text-blue-400 hover:text-blue-300 font-sans text-xs underline">
                View Full
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function viewRecord(tab, idx) {
      const record = dbData[tab][idx];
      const modal = document.getElementById('detail-modal');
      const title = document.getElementById('modal-title');
      const content = document.getElementById('modal-content');

      title.textContent = `${tab} (Row #${record.id || idx + 1})`;
      content.innerHTML = Object.entries(record).map(([k, v]) => {
        let displayVal = typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v || '');
        return `
          <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
            <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider block mb-1">${k}</span>
            <pre class="text-xs text-slate-200 whitespace-pre-wrap font-mono max-h-40 overflow-y-auto">${displayVal.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
          </div>
        `;
      }).join('');

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function applyFilter() {
      renderTable();
    }

    // Init
    renderTable();
  </script>
