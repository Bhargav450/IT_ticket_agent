version: '3.8'

services:
  # FastAPI LangGraph Autonomous Agent Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aegisops-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./it_support_agent.db
      # Connect to Ollama and Zammad running on host Mac
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ZAMMAD_URL=http://host.docker.internal:8080
      - PYTHONPATH=/app/backend
      - PYTHONUNBUFFERED=1
    volumes:
      - ./it_support_agent.db:/app/it_support_agent.db
      - ./runbooks:/app/runbooks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # React 18 Ops & Employee UI (Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aegisops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
